# ============================================
# 微信智能机器人配置
# ============================================

# LLM 配置（智谱开放平台 https://open.bigmodel.cn ，GLM-4-Flash 免费模型）
# 注意：填入自己的 API Key 后再运行，请勿将真实 Key 提交到公开仓库
llm.api-key=你的API_KEY
llm.base-url=https://open.bigmodel.cn/api/paas/v4
llm.chat-model=glm-4-flash
llm.vision-model=glm-4v-flash
llm.image-model=cogview-3-flash
llm.tts-model=cogtts
llm.timeout-ms=60000

# 语音回复开关（TTS 生成语音回复；失败自动降级为文字回复）
voice.reply-enabled=false

# 天气 API（Open-Meteo，免费无需 API Key）
weather.geocoding-url=https://geocoding-api.open-meteo.com/v1/search
weather.forecast-url=https://api.open-meteo.com/v1/forecast

# 机器人行为配置
bot.max-tool-rounds=5
bot.typing-millis=1500

# RAG 配置（极简关键词检索版）
rag.enabled=true
rag.knowledge-base=knowledge-base.json
rag.top-k=2
